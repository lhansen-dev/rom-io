name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Server tests
        run: make test
      - name: Client host tests
        run: make test-client

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v5
      - name: Build 3DS client
        run: make client
      - uses: actions/upload-artifact@v4
        with:
          name: rom-io
          path: client/rom-io.3dsx
          if-no-files-found: error

  # Pushing a tag such as v1.0.0 publishes the built client as a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rom-io
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" rom-io.3dsx --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
